[project]
name = "tgmcp"
version = "0.1.0"
description = "Read-only MCP server that lets Claude search a fixed list of Telegram chats through a userbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "telethon>=1.40,<2",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tgmcp = "tgmcp.main:main"
tgmcp-login = "tgmcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
